<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pollinations Connected</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      width: min(90%, 450px);
      background: #1d1d1d;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
    }

    a {
      color: white;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎉 Pollinations</h1>

  <div id="status">
    جاري إكمال الاتصال...
  </div>

</div>

<script>

const CLIENT_ID = "pk_w3YLBTSVBgxTVi2N";

const REDIRECT_URI =
  "https://sohaib7838.github.io/pollinations-app/callback.html";


async function finishLogin() {

  const status =
    document.getElementById("status");

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("code");

  const returnedState =
    params.get("state");

  const savedState =
    sessionStorage.getItem(
      "oauth_state"
    );

  const verifier =
    sessionStorage.getItem(
      "pkce_verifier"
    );


  if (!code) {

    status.textContent =
      "❌ لم يتم العثور على authorization code.";

    return;

  }


  if (
    !returnedState ||
    returnedState !== savedState
  ) {

    status.textContent =
      "❌ فشل التحقق من state.";

    return;

  }


  if (!verifier) {

    status.textContent =
      "❌ لم يتم العثور على PKCE verifier.";

    return;

  }


  try {

    const response =
      await fetch(
        "https://enter.pollinations.ai/api/oauth/token",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded"
          },

          body: new URLSearchParams({

            grant_type:
              "authorization_code",

            code:
              code,

            client_id:
              CLIENT_ID,

            redirect_uri:
              REDIRECT_URI,

            code_verifier:
              verifier

          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.error ||
        "Token exchange failed"
      );

    }


    if (!data.access_token) {

      throw new Error(
        "لم يتم استلام access token"
      );

    }


    sessionStorage.setItem(
      "pollinations_access_token",
      data.access_token
    );


    sessionStorage.removeItem(
      "pkce_verifier"
    );

    sessionStorage.removeItem(
      "oauth_state"
    );


    status.innerHTML = `
      <h2>✅ تم الاتصال بنجاح!</h2>
      <p>
        تم ربط حساب Pollinations.
      </p>
      <p>
        يمكنك الآن استخدام Pollen الخاص بك من التطبيق.
      </p>
      <br>
      <a href="./index.html">
        ← العودة إلى التطبيق
      </a>
    `;


  } catch (error) {

    console.error(error);

    status.innerHTML = `
      ❌ فشل الاتصال
      <br><br>
      ${error.message}
    `;

  }

}


finishLogin();

</script>

</body>
</html>
