<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pollinations Connected</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      text-align: center;
      background: #1d1d1d;
      padding: 40px;
      border-radius: 20px;
      width: min(90%, 500px);
    }

    #status {
      margin-top: 20px;
      line-height: 1.7;
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>🎉 Pollinations</h1>
  <div id="status">جاري إكمال الاتصال...</div>
</div>

<script>

const CLIENT_ID = "pk_w3YLBTSVBgxTVi2N";

const REDIRECT_URI =
  "https://sohaib7838.github.io/pollinations-app/callback.html";

async function finishLogin() {

  const status = document.getElementById("status");

  const params = new URLSearchParams(
    window.location.search
  );

  const code = params.get("code");
  const returnedState = params.get("state");

  const savedState =
    sessionStorage.getItem("oauth_state");

  const verifier =
    sessionStorage.getItem("pkce_verifier");

  if (!code) {
    status.textContent =
      "❌ لم يتم العثور على authorization code.";
    return;
  }

  if (!returnedState || returnedState !== savedState) {
    status.textContent =
      "❌ خطأ في التحقق من OAuth state.";
    return;
  }

  if (!verifier) {
    status.textContent =
      "❌ لم يتم العثور على PKCE verifier.";
    return;
  }

  try {

    const response = await fetch(
      "https://enter.pollinations.ai/api/oauth/token",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body: new URLSearchParams({

          grant_type:
            "authorization_code",

          code: code,

          client_id:
            CLIENT_ID,

          redirect_uri:
            REDIRECT_URI,

          code_verifier:
            verifier
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error_description ||
        data.error ||
        "Token exchange failed"
      );
    }

    const accessToken =
      data.access_token;

    if (!accessToken) {
      throw new Error(
        "لم يتم استلام access token"
      );
    }

    /*
      نحفظ المفتاح في sessionStorage فقط.
      لا نستخدم localStorage.
    */

    sessionStorage.setItem(
      "pollinations_access_token",
      accessToken
    );

    sessionStorage.removeItem(
      "pkce_verifier"
    );

    sessionStorage.removeItem(
      "oauth_state"
    );

    status.innerHTML = `
      <h2>✅ تم الاتصال بنجاح!</h2>
      <p>
        تم ربط حساب Pollinations بالتطبيق.
      </p>
      <p>
        يمكنك الآن العودة إلى التطبيق.
      </p>
      <br>
      <a
        href="./index.html"
        style="color:white;"
      >
        ← العودة
      </a>
    `;

  } catch (error) {

    console.error(error);

    status.innerHTML = `
      ❌ فشل الاتصال
      <br><br>
      ${error.message}
    `;
  }
}

finishLogin();

</script>

</body>
</html>
