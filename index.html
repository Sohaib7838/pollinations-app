<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sohaib AI - Image Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .box {
      width: min(100%, 500px);
      background: #1d1d1d;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .description {
      color: #aaa;
      line-height: 1.7;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #444;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #777;
    }

    button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    #connect {
      background: white;
      color: black;
    }

    #generate {
      background: #444;
      color: white;
    }

    #generate:hover {
      background: #555;
    }

    #generate:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    #download {
      background: #fff;
      color: #111;
      display: none;
    }

    #status {
      margin: 15px 0;
      color: #bbb;
      line-height: 1.6;
    }

    img {
      width: 100%;
      max-width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      display: block;
    }

    .label {
      display: block;
      text-align: right;
      margin-top: 12px;
      margin-bottom: 5px;
      color: #ccc;
      font-size: 14px;
    }

    .footer {
      margin-top: 20px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎨 Sohaib AI</h1>

  <p class="description">
    أنشئ صورًا بالذكاء الاصطناعي باستخدام Pollinations ✨
  </p>

  <button id="connect">
    🔑 Connect Pollinations
  </button>

  <label class="label" for="prompt">
    وصف الصورة
  </label>

  <input
    id="prompt"
    type="text"
    placeholder="مثال: قطة برتقالية ترتدي نظارات في الفضاء"
  >

  <label class="label" for="model">
    النموذج
  </label>

  <select id="model">
    <option value="flux">Flux</option>
  </select>

  <button id="generate" disabled>
    🖼️ إنشاء الصورة
  </button>

  <button id="download">
    ⬇️ تحميل الصورة
  </button>

  <div id="status"></div>

  <img id="result" hidden>

  <div class="footer">
    Powered by Pollinations ✨
  </div>

</div>

<script>

const CLIENT_ID = "pk_w3YLBTSVBgxTVi2N";

const REDIRECT_URI =
  "https://sohaib7838.github.io/pollinations-app/callback.html";


function randomString(length = 64) {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

  const array = new Uint8Array(length);

  crypto.getRandomValues(array);

  return Array.from(array)
    .map(x => chars[x % chars.length])
    .join("");

}


function base64url(buffer) {

  return btoa(
    String.fromCharCode(...new Uint8Array(buffer))
  )
  .replace(/\+/g, "-")
  .replace(/\//g, "_")
  .replace(/=/g, "");

}


async function connectPollinations() {

  const status =
    document.getElementById("status");

  try {

    status.textContent =
      "جاري فتح Pollinations...";

    const verifier =
      randomString();

    const state =
      randomString(32);

    sessionStorage.setItem(
      "pkce_verifier",
      verifier
    );

    sessionStorage.setItem(
      "oauth_state",
      state
    );

    const hash =
      await crypto.subtle.digest(
        "SHA-256",
        new TextEncoder().encode(verifier)
      );

    const challenge =
      base64url(hash);

    const params =
      new URLSearchParams({

        response_type: "code",

        client_id: CLIENT_ID,

        redirect_uri: REDIRECT_URI,

        scope: "profile usage",

        state: state,

        code_challenge: challenge,

        code_challenge_method: "S256",

        models: "flux",

        expiry: "7",

        budget: "5"

      });

    window.location.href =
      "https://enter.pollinations.ai/authorize?" +
      params.toString();

  } catch (error) {

    status.textContent =
      "❌ " + error.message;

  }

}


async function generateImage() {

  const token =
    sessionStorage.getItem(
      "pollinations_access_token"
    );

  const promptInput =
    document.getElementById("prompt");

  const model =
    document.getElementById("model").value;

  const status =
    document.getElementById("status");

  const image =
    document.getElementById("result");

  const download =
    document.getElementById("download");

  const prompt =
    promptInput.value.trim();


  if (!token) {

    status.textContent =
      "❌ يجب الاتصال بـ Pollinations أولًا.";

    return;

  }


  if (!prompt) {

    status.textContent =
      "⚠️ اكتب وصف الصورة أولًا.";

    promptInput.focus();

    return;

  }


  status.textContent =
    "⏳ جاري إنشاء الصورة...";

  image.hidden = true;

  download.style.display = "none";


  try {

    const url =
      "https://gen.pollinations.ai/image/" +
      encodeURIComponent(prompt) +
      "?model=" +
      encodeURIComponent(model);


    const response =
      await fetch(url, {

        headers: {

          "Authorization":
            "Bearer " + token

        }

      });


    if (!response.ok) {

      const text =
        await response.text();

      throw new Error(
        "HTTP " +
        response.status +
        ": " +
        text
      );

    }


    const blob =
      await response.blob();


    const imageUrl =
      URL.createObjectURL(blob);


    image.src =
      imageUrl;

    image.alt =
      prompt;

    image.hidden =
      false;


    download.href =
      imageUrl;

    download.download =
      "sohaib-ai-image.jpg";

    download.style.display =
      "block";


    status.textContent =
      "✅ تم إنشاء الصورة بنجاح!";


  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ فشل إنشاء الصورة: " +
      error.message;

  }

}


document
  .getElementById("connect")
  .addEventListener(
    "click",
    connectPollinations
  );


document
  .getElementById("generate")
  .addEventListener(
    "click",
    generateImage
  );


document
  .getElementById("prompt")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !document.getElementById("generate").disabled
      ) {

        generateImage();

      }

    }
  );


if (
  sessionStorage.getItem(
    "pollinations_access_token"
  )
) {

  document
    .getElementById("generate")
    .disabled = false;

  document
    .getElementById("status")
    .textContent =
      "✅ متصل بـ Pollinations. اكتب وصف الصورة.";

}

</script>

</body>
</html>
